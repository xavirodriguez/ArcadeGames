name: Apply SharedVFX renderRandom fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/presentation-vfx-render-random-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply one-line fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/games/shared/rendering/SharedVFX.ts')
          text = p.read_text()
          old = '  if (particlePool):\n    const rng = world.gameplayRandom;'
          # file uses real newlines
          old = '  if (particlePool) {\n    const rng = world.gameplayRandom;'
          new = '  if (particlePool) {\n    const rng = world.renderRandom;'
          if old not in text:
            raise SystemExit('pattern not found')
          p.write_text(text.replace(old, new, 1))
          print('patched')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/games/shared/rendering/SharedVFX.ts
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "fix(vfx): use renderRandom for explosion particle burst in SharedVFX"
          git push origin HEAD:fix/presentation-vfx-render-random-v2

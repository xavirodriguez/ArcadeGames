name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sprite atlases and metadata
        run: pnpm run sprites:validate

      - name: Test sprite metadata validator and animator
        run: pnpm exec jest --config src/games/shared/jest.config.cjs --runInBand --runTestsByPath src/games/shared/sprites/SpriteManifestValidator.test.ts src/games/shared/sprites/SpriteAnimator.test.ts src/games/shared/sprites/SpriteDrawer.test.ts src/games/shared/sprites/AssetLoaderAdapter.test.ts

      - name: Test shared sprite destination geometry
        run: pnpm --filter=@tiny-aster/core exec jest --runInBand --runTestsByPath tests/SpriteSheetDefinition.test.ts

      - name: Lint sprite metadata and animation files
        run: pnpm exec eslint packages/core/src/assets/SpriteSheetDefinition.ts packages/core/tests/SpriteSheetDefinition.test.ts scripts/validate-sprites.ts src/games/shared/sprites/SpriteManifestValidator.ts src/games/shared/sprites/SpriteManifestValidator.test.ts src/games/shared/sprites/SpriteTypes.ts src/games/shared/sprites/SpriteAnimator.ts src/games/shared/sprites/SpriteAnimator.test.ts src/games/shared/sprites/SpriteDrawer.test.ts src/games/shared/sprites/AssetLoaderAdapter.ts src/games/shared/sprites/AssetLoaderAdapter.test.ts src/games/hitandrun/rendering/HitRunSpriteAtlas.ts src/games/hitandrun/__tests__/HitRunSpriteAtlas.test.ts src/games/hitandrun/__tests__/HitRunSpritePreload.test.ts src/games/hitandrun/__tests__/HitRunSamuraiEnemy.test.ts src/games/hitandrun/__tests__/HitAndRun.test.ts src/games/hitandrun/rendering/SamuraiAnimationSystems.ts src/games/hitandrun/waves/HitRunEnemyPool.ts src/games/hitandrun/belt/registerBeltPlayerBlueprint.ts playwright.config.ts e2e/games.spec.ts e2e/hitandrun.spec.ts

      - name: Build through Turborepo
        run: pnpm exec turbo run build

      - name: Lint through Turborepo
        run: pnpm exec turbo run lint

      - name: Typecheck through Turborepo
        run: pnpm exec turbo run typecheck

      - name: Typecheck application and game routes
        run: pnpm run typecheck:app

      - name: Run tests through Turborepo
        run: pnpm exec turbo run test

      - name: Enforce canonical input contract
        run: pnpm run check:input-contract

      - name: Measure input-path performance baseline
        run: pnpm exec tsx packages/core/src/__benchmarks__/inputPathBenchmark.ts

      - name: Run all game unit and regression tests
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: pnpm run test:games:ci

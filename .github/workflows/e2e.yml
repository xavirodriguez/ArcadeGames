name: E2E

on:
  pull_request:
    branches: [master, develop]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "src/games/**"
      - "src/app/**"
      - "app/**"
      - "expo-router/**"
      - "packages/renderer-*/**"
      - "packages/react-native/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - "app.json"
      - ".github/workflows/e2e.yml"
  schedule:
    # Full suite once a day (UTC)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "E2E suite to run"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Smoke should finish well under this; full suite keeps previous headroom.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 12 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve suite mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "smoke=1" >> "$GITHUB_OUTPUT"
            echo "label=smoke" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" = "smoke" ]; then
            echo "smoke=1" >> "$GITHUB_OUTPUT"
            echo "label=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=0" >> "$GITHUB_OUTPUT"
            echo "label=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E suite (${{ steps.mode.outputs.label }})
        env:
          E2E_SMOKE: ${{ steps.mode.outputs.smoke }}
        run: |
          if [ "${{ steps.mode.outputs.smoke }}" = "1" ]; then
            pnpm test:e2e:smoke
          else
            pnpm test:e2e
          fi

      - name: Upload Playwright diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

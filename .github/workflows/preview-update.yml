name: Preview Update

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: preview-update-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 21.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish validated commit to Preview
        run: pnpm exec eas update --branch preview --message "$COMMIT_MESSAGE" --non-interactive
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}

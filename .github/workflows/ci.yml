name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sprite atlases and metadata
        run: pnpm run sprites:validate

      - name: Test sprite metadata validator and animator
        run: pnpm exec jest --config src/games/shared/jest.config.cjs --runInBand --runTestsByPath src/games/shared/sprites/SpriteManifestValidator.test.ts src/games/shared/sprites/SpriteAnimator.test.ts src/games/shared/sprites/SpriteDrawer.test.ts src/games/shared/sprites/AssetLoaderAdapter.test.ts

      - name: Test shared sprite destination geometry
        run: pnpm --filter=@tiny-aster/core exec jest --runInBand --runTestsByPath tests/SpriteSheetDefinition.test.ts

      - name: Lint sprite metadata and animation files
        run: pnpm exec eslint packages/core/src/assets/SpriteSheetDefinition.ts packages/core/tests/SpriteSheetDefinition.test.ts scripts/validate-sprites.ts src/games/shared/sprites/SpriteManifestValidator.ts src/games/shared/sprites/SpriteManifestValidator.test.ts src/games/shared/sprites/SpriteTypes.ts src/games/shared/sprites/SpriteAnimator.ts src/games/shared/sprites/SpriteAnimator.test.ts src/games/shared/sprites/SpriteDrawer.test.ts src/games/shared/sprites/AssetLoaderAdapter.ts src/games/shared/sprites/AssetLoaderAdapter.test.ts src/games/hitandrun/rendering/HitRunSpriteAtlas.ts src/games/hitandrun/__tests__/HitRunSpriteAtlas.test.ts src/games/hitandrun/__tests__/HitRunSpritePreload.test.ts

      - name: Build through Turborepo
        run: pnpm exec turbo run build

      - name: Lint through Turborepo
        run: pnpm exec turbo run lint

      - name: Typecheck through Turborepo
        run: pnpm exec turbo run typecheck

      - name: Run tests through Turborepo
        run: pnpm exec turbo run test

      - name: Run Hit & Run regression tests
        run: pnpm exec jest --config src/games/hitandrun/jest.config.cjs --runInBand --testPathPattern='src/games/hitandrun/__tests__'

      - name: Run vertical-shmup P0 TDD integration tests
        if: ${{ always() && steps.install_dependencies.outcome == 'success' }}
        run: pnpm exec jest --config src/games/vertical-shmup/jest.config.cjs --runInBand --testPathPattern='src/games/vertical-shmup/__tests__'
